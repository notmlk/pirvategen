<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notice</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Canvas particles */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* Center content */
.container {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* Neon text */
.neon {
  color: #fff;
  text-shadow:
    0 0 5px #fff,
    0 0 10px #fff,
    0 0 20px #fff,
    0 0 40px #fff;
  font-weight: bold;
  letter-spacing: 2px;
}

.title {
  font-size: 2.5rem;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 1.5rem;
  margin: 20px 0;
}

/* Link box */
a {
  color: #fff;
  text-decoration: none;
  font-size: 1.2rem;
  padding: 12px 20px;
  border: 1px solid #fff;
  border-radius: 8px;
  box-shadow:
    0 0 10px #fff,
    0 0 20px #fff;
  transition: 0.3s;
}

a:hover {
  background: #fff;
  color: #000;
  box-shadow: 0 0 30px #fff;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
  <div class="neon title">
    THIS WEBSITE DOESNT WORK ANYMORE
  </div>

  <div class="neon subtitle">
    GO TO
  </div>

  <a href="https://discord.gg/6MxP3Qx3" target="_blank">
    https://discord.gg/6MxP3Qx3
  </a>

  <div class="neon subtitle" style="margin-top:30px;">
    TO GENERATE A SCRIPT FROM OUR NEW BOT
  </div>
</div>

<script>
// ===== PARTICLES SYSTEM =====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2;
    this.speedX = (Math.random() - 0.5) * 1;
    this.speedY = (Math.random() - 0.5) * 1;
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
  }

  draw() {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  particlesArray = [];
  for (let i = 0; i < 120; i++) {
    particlesArray.push(new Particle());
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let p of particlesArray) {
    p.update();
    p.draw();
  }

  requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  init();
});
</script>

</body>
</html>
